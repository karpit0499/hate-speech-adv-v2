[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hate-speech-adv-protocol"
version = "0.1.0"
description = "Leakage-controlled training and evaluation protocol for hate-speech-adv v2"
requires-python = ">=3.10,<3.13"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]
